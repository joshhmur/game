:root{--ink:#1d2733;--blue:#d6e8f5;--pale:#f6f9fc;--grey:#98a4b0;--soft:#b6c0ca;--f:'VT323',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--f);cursor:default!important}input{cursor:text!important}
html,body{height:100%}
body{background:#fafcfe;color:var(--ink);font-size:20px;line-height:1.15;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none}
@property --s1{syntax:'<color>';inherits:true;initial-value:#e3eef8}
@property --s2{syntax:'<color>';inherits:true;initial-value:#fafcfe}
/* soft climbing scene behind the UI */
#world{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(var(--s1),var(--s2) 75%);container-type:size;transition:--s1 3.4s ease,--s2 3.4s ease}
#clouds,#cf{position:absolute;left:0;right:0;bottom:0;height:1350cqh;pointer-events:none}
#mtn{position:absolute;left:0;right:0;bottom:0;height:max(810cqh,675cqw);pointer-events:none}
#mimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;opacity:0;transition:opacity .8s}#mimg.on{opacity:.9}
.cl{position:absolute;left:0;animation:cd linear infinite}.cl svg{width:100%;display:block}#cf .cl{filter:blur(1.5px)}
@keyframes cd{from{transform:translateX(-35cqw)}to{transform:translateX(125cqw)}}
#speed{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .25s}#speed.on{opacity:1}
#speed i{position:absolute;top:-60%;width:2px;background:linear-gradient(transparent,rgba(255,255,255,.95),rgba(170,205,245,.4),transparent);animation:st .45s linear infinite}
@keyframes st{from{transform:translateY(0)}to{transform:translateY(320%)}}
#speed::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,240,180,.5),transparent 62%);opacity:0}#speed.on::after{animation:fl 1.6s ease-out}
@keyframes fl{0%{opacity:0}10%{opacity:1}30%{opacity:.35}45%{opacity:.8}100%{opacity:0}}
.sp{position:fixed;margin:-4px;border-radius:50%;background:radial-gradient(#fff,#ffd978);box-shadow:0 0 10px #ffd978;pointer-events:none;z-index:50;animation:sk 1.4s cubic-bezier(.1,.7,.2,1) forwards}
@keyframes sk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.jolt{animation:jolt .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes jolt{0%,100%{translate:0 0}8%{translate:calc(var(--k,1)*-1.5px) calc(var(--k,1)*6px)}18%{translate:calc(var(--k,1)*1.5px) calc(var(--k,1)*-7px)}30%{translate:calc(var(--k,1)*-1px) calc(var(--k,1)*5px)}44%{translate:calc(var(--k,1)*1px) calc(var(--k,1)*-4px)}58%{translate:0 calc(var(--k,1)*2.5px)}72%{translate:0 calc(var(--k,1)*-1px)}}
.shake{animation:shake .45s}@keyframes shake{0%,100%{transform:none}15%{transform:translate(-3px,1px)}30%{transform:translate(3px,-1px)}45%{transform:translate(-2px,1px)}60%{transform:translate(1.5px,0)}75%{transform:translate(-1px,0)}}
/* the UI */
#stage{position:fixed;inset:0;z-index:5}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto}.scr.on{display:flex}
h1{font-size:68px;letter-spacing:.08em;text-transform:uppercase;line-height:1;font-weight:400}
.sub{color:var(--grey);font-size:19px}
.btn{width:200px;height:46px;border:1.5px solid var(--ink);background:var(--blue);font-size:23px;box-shadow:0 2px 0 rgba(29,39,51,.55);transition:transform .1s,box-shadow .1s,opacity .4s}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(29,39,51,.55)}.btn:active{transform:translateY(2px);box-shadow:none}.btn.dot{background:var(--pale);border-style:dotted;box-shadow:none}.btn.sm{width:auto;height:34px;padding:0 14px;font-size:19px}
.gap{height:18px}
#mb{position:fixed;top:16px;right:16px;z-index:30;width:34px;height:34px;border:1.5px dashed #8fa6b8;background:#fafcfe;font-size:22px;color:#8fa6b8;transition:transform .3s var(--e),background .2s}#mb:hover{background:#eef5fb}#mb.open{transform:rotate(90deg)}
#mm{position:fixed;top:58px;right:16px;z-index:30;display:flex;flex-direction:column;background:var(--pale);border:1.5px solid var(--ink);min-width:160px;visibility:hidden;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:100% 0;transition:opacity .2s,transform .25s var(--e),visibility .2s}#mm.on{visibility:visible;opacity:1;transform:none}
#mm button{padding:8px 12px;text-align:left;font-size:21px;border-bottom:1px dotted #9fb3c4}#mm button:last-child{border:0}
.col{width:min(400px,90vw);display:flex;flex-direction:column;gap:14px}
.tr{display:flex;align-items:center;gap:10px}#tb{flex:1;height:12px;border:1.5px solid var(--ink);background:#fff}#tb i{display:block;height:100%;background:#bcd9ee;transform-origin:0 50%}#tn{font-size:16px;color:var(--grey);width:34px;text-align:right}
.card{border:1.5px solid var(--ink);background:var(--pale);padding:14px 14px 16px}
.lab{color:var(--grey);font-size:16px}.q{font-size:27px;line-height:1.1;margin:4px 0 6px;font-weight:700}.hint{color:var(--soft);font-size:16px}
.ir{display:flex;gap:8px}#inp{flex:1;min-width:0;height:46px;border:1.5px solid var(--ink);background:#f8f8f4;padding:0 12px;font-size:24px;outline:none;color:var(--ink);text-transform:lowercase}#inp::placeholder{color:#c5ccd3}#inp{transition:background .2s,box-shadow .25s}#inp:focus{background:#fff;box-shadow:0 0 0 3px #cfe4f4}
.ir .btn{width:90px}
#nq{display:none;color:#b8574f;font-size:18px}#dym{display:none;align-self:flex-start}
.stamp{display:inline-block;transform:rotate(-3deg);padding:2px 14px;font-size:19px;background:var(--bg,#fff);border:1px solid rgba(29,39,51,.14);text-transform:capitalize}
.t-pk{--bg:#f6efd3}.t-sl{--bg:#ebdcf6}.t-su{--bg:#dcecf8}.t-sp{--bg:#e3f6dc}.t-go{--bg:#f1f1ee}.t-av{--bg:#f8e0dd}
.rc{position:relative;border:1.5px solid var(--ink);background:var(--pale);padding:48px 14px 16px;min-height:150px}.rc .stamp{position:absolute;left:12px;top:14px}
.ra{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ra b{font-size:30px;font-weight:700}.ra span{color:var(--soft);font-size:24px}.rf{color:var(--soft);font-size:17px;margin-top:6px}
#nx{opacity:0;pointer-events:none;width:100%}#nx.on{opacity:1;pointer-events:auto}
.big{font-size:56px;line-height:1}.big small{font-size:24px;color:var(--grey)}
.list{max-height:44vh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted #9fb3c4}.row:last-child{border:0}.row b{font-size:21px}.row small{color:var(--grey);font-size:16px}.row .bs{color:var(--soft);font-size:15px;display:block}.row .rt{display:flex;align-items:center;gap:8px}.row .rt .stamp{font-size:16px;padding:1px 10px}.row .rt em{font-style:normal;font-size:22px;min-width:34px;text-align:right}
.two{display:flex;gap:8px}.two .btn{flex:1;width:auto}
#cp{color:var(--grey);font-size:16px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scr.on>*,.scr.on .col>*{animation:up .5s var(--e) backwards}
.scr.on>.col{animation:none}
.scr.on>:nth-child(2),.scr.on .col>:nth-child(2){animation-delay:.07s}.scr.on>:nth-child(3),.scr.on .col>:nth-child(3){animation-delay:.14s}
.scr.on>:nth-child(4),.scr.on .col>:nth-child(4){animation-delay:.21s}.scr.on>:nth-child(5),.scr.on .col>:nth-child(5){animation-delay:.28s}
#nx{animation:none!important}h1.t{animation:none!important}
.t span{display:inline-block;animation:up .55s var(--e) backwards;animation-delay:calc(var(--i)*70ms + .1s);transition:transform .2s var(--e)}.t span:hover{transform:translateY(-5px)}
.row{animation:up .45s var(--e) backwards;animation-delay:calc(var(--i,0)*70ms + .2s)}
@keyframes slam{0%{opacity:0;transform:rotate(-3deg) scale(1.9)}55%{opacity:1;transform:rotate(-3deg) scale(.93)}100%{transform:rotate(-3deg) scale(1)}}
@keyframes glow{50%{box-shadow:0 0 16px 3px rgba(240,200,90,.75)}}
.rc .stamp{animation:slam .5s .22s var(--e) backwards}.rc .t-pk{animation:slam .5s .22s var(--e) backwards,glow 1.3s ease-in-out .8s 2}
#tn.low{color:#c0554f;animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}

<body>
<div id="world"><div id="clouds"></div><div id="mtn"><img id="mimg" alt=""></div><div id="cf"></div><div id="speed"></div></div>
<button id="mb" aria-label="Menu">=</button>
<div id="mm"><button id="m-home">home</button><button id="m-tiers">score tiers</button><button id="m-snd">sound: on</button></div>

<div id="stage">
 <section id="s-home" class="scr on">
  <h1 class="t" id="ttl">Peakly</h1><p class="sub">Six prompts, less letters scores better</p><div class="gap"></div>
  <button class="btn" id="pd">play today's</button><button class="btn dot" id="pa">archive</button>
 </section>
 <section id="s-game" class="scr">
  <div class="col">
   <div class="tr"><div id="tb"><i id="tbi"></i></div><span id="tn">20s</span></div>
   <div class="card"><div class="lab" id="cat"></div><div class="q" id="q"></div><div class="hint">shorter answers score better</div></div>
   <form id="f" autocomplete="off"><div class="ir" id="ir"><input id="inp" maxlength="48" autocapitalize="none" spellcheck="false" placeholder="your answer.." aria-label="Your answer"><button class="btn" type="submit">ok</button></div></form>
   <div id="nq">not quite. that's not on the list.</div><button class="btn dot sm" id="dym" type="button"></button>
  </div>
 </section>
 <section id="s-ok" class="scr">
  <div class="col"><div class="rc"><span class="stamp" id="okS"></span><div class="ra"><b id="okA"></b><span id="okP"></span></div><div class="rf" id="okF"></div></div>
  <button class="btn" id="nx" type="button">continue</button></div>
 </section>
 <section id="s-done" class="scr">
  <div class="col"><div class="card"><div class="lab">day 1 complete</div><div class="big"><span id="dsc">0</span> <small id="dmax"></small></div><div class="hint" id="dtag"></div></div>
  <div class="card list" id="rows"></div>
  <div class="two"><button class="btn" id="shr">share</button><button class="btn dot" id="rpl">replay</button></div><span id="cp"></span></div>
 </section>
 <section id="s-arch" class="scr"><div class="col"><h1 style="font-size:46px">archive</h1><div class="card list" id="al"></div></div></section>
 <section id="s-tiers" class="scr"><div class="col"><h1 style="font-size:46px">score tiers</h1><p class="sub">the shorter your answer, the higher your score</p><div class="card list" id="tl"></div></div></section>
</div>

<script>
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('en-US');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROUNDS=6,MAXM=600,KEY='peakly:v8:p1';
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const TP=[{k:'pk',n:'peaked',m:100,e:'\ud83d\udfe8',sub:'it\'s windy at the top'},{k:'sl',n:'slippery',m:85,e:'\ud83d\udfea',sub:'thin ice up here'},{k:'su',n:'lifted',m:60,e:'\ud83d\udfe6',sub:'above the clouds, nice'},{k:'sp',n:'sloped',m:30,e:'\ud83d\udfe9',sub:'slowly tilting upwards'},{k:'go',n:'goat',m:10,e:'\u2b1c',sub:'just chewing on grass at the bottom'}];
const AV={k:'av',n:'avalanche',m:0,e:'\ud83d\udca5',sub:'nothing gained'};
const TPK=Object.fromEntries([...TP,AV].map(t=>[t.k,t]));
// ---------- day one question bank ----------
const BANK=[
['Name something you can buy in a grocery store that comes in a bottle','Ale','Milk, Soda, Cola, Beer, Wine, Mayo, Jam, Soap','Water, Juice, Syrup, Honey, Cream, Tonic, Sauce, Stock','Ketchup, Mustard, Vinegar, Kombucha, Lemonade, Smoothie, Hot sauce, Soy sauce, Fish sauce, Olive oil, Oat milk','Mayonnaise, Cranberry juice, Tomato juice, Orange juice, Salad dressing, Barbecue sauce, Chocolate milk, Sparkling water, Mineral water, Strawberry milk, Teriyaki sauce, Vanilla extract, Coffee creamer, Coconut water, Apple juice, Almond milk, Maple syrup, Passionfruit juice, Balsamic vinegar, Worcestershire sauce, Pomegranate juice, Strawberry lemonade, Raspberry vinaigrette, Sweetened condensed milk, Organic apple cider vinegar, Chocolate flavoured syrup, Ready-to-drink iced coffee, Mango passionfruit smoothie'],
['Name a type of alcohol you drink as a shot','Gin, Rum, Rye','Wine, Sake, Soju, Ouzo, Raki','Vodka, Jager, Pisco, Rakia','Whisky, Mezcal, Grappa, Brandy, Scotch, Cognac, Kahlua, Cuervo','Tequila, Whiskey, Bourbon, Sambuca, Schnapps, Fireball, Jagermeister, Absinthe, Amaretto, Aquavit, Limoncello, Everclear, Chartreuse, Baileys, Rumchata, Moonshine, Jaegerbomb, Jameson, Goldschlager, Irish whiskey, Rye whiskey, Butterscotch schnapps, Jack Daniels'],
['Name a main character from the TV show Lost','Jin, Sun, Ben, Eko','Kate, Jack, Walt, Rose, Hugo, John, Ford, Pace, Kwon, Hume','Locke, Sayid, Boone, Miles, Linus, Jacob, Ethan, Penny, Reyes, James, Frank, Libby, Ilana, Lloyd, Burke, Nikki, Paulo','Sawyer, Hurley, Claire, Daniel, Juliet, Austen, Jarrah, Alpert, Dawson, Nadler, Cortez','Shephard, Charlie, Desmond, Michael, Shannon, Bernard, Richard, Lapidus, Straume, Faraday, Charlotte, Widmore, Carlyle, Littleton, Vincent, Hawking, Ana Lucia, Man in Black, Jack Shephard, Kate Austen, John Locke, James Ford, Hugo Reyes, Sayid Jarrah, Charlie Pace, Claire Littleton, Jin Kwon, Sun Kwon, Michael Dawson, Desmond Hume, Ben Linus, Juliet Burke, Daniel Faraday, Miles Straume, Richard Alpert, Frank Lapidus, Boone Carlyle, Shannon Rutherford, Walt Lloyd, Rose Nadler, Bernard Nadler, Ana Lucia Cortez, Charles Widmore, Penny Widmore'],
['Name a sport that you ride on something for','BMX, MTB','Polo, Luge, Surf, Bike, Kart, Sled','Rodeo, Skate, Derby','Biking, Racing, Skiing, Sledge, Riding','Cycling, Surfing, Bobsled, Bobsleigh, Skeleton, Karting, Go karting, Motocross, Dressage, Eventing, Speedway, Equestrian, Horse racing, Horse riding, Horseback riding, Snowboarding, Skateboarding, Wakeboarding, Kitesurfing, Windsurfing, Jet skiing, Mountain biking, Motorcycling, Bull riding, Show jumping, Steeplechase, Trail riding, Road cycling, Track cycling, Tobogganing, Sledding, Snowmobiling, Jousting, Dirt biking, Quad biking, Rollerblading, Scootering, Hoverboarding, Motorsport, Bicycling'],
['Name an outdoor activity that requires no skills to start','Run, Jog, BBQ','Walk, Hike, Camp, Swim, Fish, Play, Trek','Fetch, Swing, Dance, Chill','Hiking, Picnic, Stroll, Ramble','Walking, Camping, Fishing, Running, Jogging, Swimming, Sunbathing, Stargazing, Birdwatching, Barbecue, Foraging, Frisbee, Gardening, Sightseeing, Cloud watching, Kite flying, Beachcombing, Berry picking, Nature walk, Rock pooling, Hammocking, Picnicking, Bonfire, Stone skipping, People watching, Geocaching, Fruit picking, Leaf peeping, Beach day, Lounging, Playing, Trekking, Strolling, Rambling'],
['Name a US state that ends with the letter O','Ohio','Idaho','','Colorado','New Mexico']
].map(([q,...tiers])=>{const map=new Map();tiers.forEach((t,i)=>t.split(', ').forEach(w=>{const k=norm(w);if(k&&!map.has(k))map.set(k,{ti:i,label:w})}));return{q,map,best:tiers[0]}});
const R=BANK;
// "did you mean": the closest listed answer, if the typo is small
const lev=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]};
function suggest(w,r){let best=null,bd=99;const lim=Math.max(1,Math.floor(w.length/4));for(const[k,v]of r.map){if(Math.abs(k.length-w.length)>lim)continue;const d=lev(w,k);if(d<=lim&&(d<bd||(d===bd&&v.ti<best.ti))){bd=d;best=v}}return best}
let S={i:0,total:0,log:[]};try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.log)S=x}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cur='home',busy=false,tmr=null,tAnim=null,dl=0;

// ---------- scene: tall paper-cut mountain + drifting clouds ----------
{const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8100" viewBox="0 0 1200 8100" fill="none" stroke-linejoin="round" stroke-linecap="round"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="2400"><stop offset="0" stop-color="#fff"/><stop offset=".38" stop-color="#fff"/><stop offset=".65" stop-color="#eaf2fa"/><stop offset="1" stop-color="#d3e3f2"/></linearGradient></defs><style>path{vector-effect:non-scaling-stroke}</style><g transform="scale(1,3.375)" stroke="#6f8aa3" stroke-width="2">'
 +'<path d="M-100 2400V1650l200-330 130 180 150-120 260 640z" fill="#e8f1fa"/><path d="M1300 2400V1500l-180-260-160 210-130-100-220 650z" fill="#e8f1fa"/>'
 +'<path d="M-60 2400 120 1950 230 1780 300 1500 380 1320 450 1010 520 700 560 430 600 140 650 380 700 560 770 520 830 800 900 1020 980 1300 1060 1560 1130 1900 1260 2400z" fill="url(#g)"/>'
 +'<path d="M600 140 650 380 700 560 770 520 830 800 900 1020 980 1300 1060 1560 1130 1900 1260 2400H760L730 1700 700 1250 660 900 630 600z" fill="#dce8f4" stroke="none"/>'
 +'<path d="M600 140 630 600 660 900 700 1250 730 1700 760 2400M520 700 560 1100 520 1500 580 2000M830 800 810 1200 850 1700" stroke-width="1.5" opacity=".55"/>'
 +'<path d="M470 840 520 780 545 840 590 740 620 820 660 740 700 840 745 780 790 870"/></g>'
 +'<g transform="translate(0,5700)"><path d="M0 2400V2230c150-50 300-20 450-55s300 25 450-10 220 15 300-25V2400z" fill="#d3e3f2" stroke="#6f8aa3" stroke-width="2"/></g></svg>';
 const img=$('mimg');img.onload=()=>img.classList.add('on');img.src='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
 const C='<svg viewBox="0 0 240 100"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dbe8f5"/></linearGradient></defs><g fill="url(#cg)"><ellipse cx="120" cy="72" rx="105" ry="22"/><circle cx="70" cy="58" r="28"/><circle cx="108" cy="42" r="36"/><circle cx="152" cy="52" r="30"/><circle cx="188" cy="64" r="20"/></g></svg>';
 const mkc=(id,n,seed,z)=>{const host=$(id);for(let i=0;i<n;i++){const r=k=>{const x=Math.sin(seed*97+i*13.7+k*5.1)*10000;return x-Math.floor(x)};
  const el=document.createElement('div');el.className='cl';el.innerHTML=C;if(r(6)>.5)el.firstChild.style.transform='scaleX(-1)';
  el.style.cssText='width:'+(z?200+r(1)*240:100+r(1)*190).toFixed(0)+'px;bottom:'+(r(2)*1340).toFixed(1)+'cqh;opacity:'+(z?.5+r(3)*.3:.7+r(3)*.3).toFixed(2)+';animation-duration:'+(z?45+r(4)*40:90+r(4)*100).toFixed(0)+'s;animation-delay:-'+(r(5)*120).toFixed(0)+'s';host.appendChild(el)}};
 mkc('clouds',72,1,0);mkc('cf',28,2,1);
 const sp=$('speed');for(let i=0;i<24;i++){const l=document.createElement('i');l.style.cssText='left:'+(i*4.1+Math.random()*3).toFixed(1)+'%;height:'+(35+Math.random()*35).toFixed(0)+'%;animation-duration:'+(.28+Math.random()*.3).toFixed(2)+'s;animation-delay:-'+(Math.random()*.5).toFixed(2)+'s;opacity:'+(.45+Math.random()*.5).toFixed(2);sp.appendChild(l)}}
const world=$('world');
const tyHome=()=>{const vh=world.clientHeight,W=world.clientWidth,H=Math.max(8.1*vh,6.75*W);return .4*vh-.058*H-vh+H};
const homeF=()=>1+.3*world.clientHeight/tyHome();   // summit view, a little lower so the title sits above the peak
let mF=1,mT=0;
function scene(f,d,t=0){mF=f;mT=t;const ty=tyHome()*f;for(const[id,k]of[['mtn',1],['clouds',.7],['cf',1.2]]){const m=$(id);m.style.transitionDuration=d+'s';m.style.transitionTimingFunction='cubic-bezier(.6,.05,.2,1)';m.style.transform='translateY('+ty*k+'px)'}
 const L=(a,b)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),s=world.style;s.setProperty('--s1','rgb('+L([227,238,248],[150,190,230])+')');s.setProperty('--s2','rgb('+L([250,252,254],[210,230,248])+')')}
scene(homeF(),0);addEventListener('resize',()=>scene(mF,0,mT));
const progF=()=>Math.min(1,S.log.reduce((a,l,i)=>a+l.m*(1+.4*i)*(l.k==='pk'?1.3:1),0)/1200);
function climb(d){const f=progF();scene(f,d,f)}

// ---------- sound ----------
let AC=null,on=true;try{on=localStorage.getItem('peakly:snd')!=='0'}catch(e){}
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function noise(d){const c=ac(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s}
function tone(f,d,v,at=0){const c=ac();if(!c||!on)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function click(){const c=ac();if(!c||!on)return;[0,.07].forEach((at,i)=>{const n=noise(.04),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;f.type='bandpass';f.frequency.value=i?1800:3000;f.Q.value=3;g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);n.connect(f).connect(g).connect(c.destination);n.start(t)});tone(2200,.03,.05)}
function whoosh(){const c=ac();if(!c||!on)return;const n=noise(1.8),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2400,t+.7);f.frequency.exponentialRampToValueAtTime(250,t+1.7);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.6);g.gain.linearRampToValueAtTime(0,t+1.7);n.connect(f).connect(g).connect(c.destination);n.start(t);[1568,1319,1047,784,659].forEach((fr,i)=>tone(fr,1.1,.07,.15+i*.18))}
function thud(){const c=ac();if(!c||!on)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(38,t+.25);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.35)}
function sparkle(){[523,659,784,988,1175,1319,1568,1760,1976,2349,2637,3136].forEach((f,i)=>tone(f,.7,.06,i*.07));[1568,1976,2349].forEach((f,i)=>tone(f,1.2,.05,.9+i*.1));tone(98,.6,.14);tone(49,.9,.12)}
// ---------- feel: a perfect answer jolts the screen; every answer trembles a little while you climb ----------
function perfectFx(){const sp=$('speed');sp.classList.remove('on');void sp.offsetWidth;sp.classList.add('on');clearTimeout(perfectFx.t);perfectFx.t=setTimeout(()=>sp.classList.remove('on'),4600);
 [[0,1.5],[380,1],[800,.6],[1300,.35]].forEach(([d,k])=>setTimeout(()=>{for(const id of['world','stage']){const e=$(id);e.style.setProperty('--k',k);e.classList.remove('jolt');void e.offsetWidth;e.classList.add('jolt')}},d));
 if(!still)for(let i=0;i<30;i++){const b=document.createElement('b');b.className='sp';const a=Math.random()*6.283,d=100+Math.random()*260;b.style.cssText='left:50%;top:44%;--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px;width:'+(4+Math.random()*7)+'px;height:'+(4+Math.random()*7)+'px;animation-delay:'+Math.random()*.25+'s';document.body.appendChild(b);setTimeout(()=>b.remove(),1900)}
 try{navigator.vibrate&&navigator.vibrate([24,40,24,40,60,50,90])}catch(e){}}
function swayFx(d,k){if(still)return;const n=Math.max(8,Math.round(d*10)),kf=[{translate:'0 0'}];for(let i=1;i<n;i++){const a=1.6*k*Math.sin(Math.PI*i/n);kf.push({translate:((Math.random()-.5)*a*.6).toFixed(2)+'px '+((Math.random()-.5)*2*a).toFixed(2)+'px'})}kf.push({translate:'0 0'});for(const id of['world','stage'])$(id).animate(kf,{duration:d*1000,easing:'linear'})}
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};

function countUp(el,to,pre,ms){if(still){el.textContent=pre+to;return}const t0=performance.now(),f=now=>{const k=Math.min(1,(now-t0)/ms);el.textContent=pre+Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
// ---------- screens ----------
function show(v){cur=v;for(const x of['home','game','ok','done','arch','tiers'])$('s-'+x).classList.toggle('on',x===v);
 $('mm').classList.remove('on');$('mb').classList.remove('open');if(v!=='game')stopT();
 if(v==='home')$('pd').textContent=S.i>=ROUNDS?'view today\'s':S.i?'continue':'play today\'s';
 if(!['game','ok'].includes(v))scene(homeF(),1.2,0)}
function play(fresh){if(fresh&&S.i>=ROUNDS){S={i:0,total:0,log:[],best:S.best||{total:S.total,log:S.log}};sv()}
 if(S.i>=ROUNDS){done();return}
 show('game');const f=progF();scene(f,1.2,f);round()}
function round(){busy=false;$('q').textContent=R[S.i].q;$('cat').textContent='prompt '+(S.i+1)+' of '+ROUNDS;$('inp').value='';$('nq').style.display='none';$('dym').style.display='none';startT();setTimeout(()=>$('inp').focus(),80)}
// 20 seconds per question
function startT(){stopT();dl=Date.now()+20000;$('tbi').style.background='';$('tn').classList.remove('low');tAnim=$('tbi').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:20000,easing:'linear',fill:'forwards'});
 tmr=setInterval(()=>{const s=Math.max(0,Math.ceil((dl-Date.now())/1000));$('tn').textContent=s+'s';$('tn').classList.toggle('low',s<=5);$('tbi').style.background=s<=5?'#e8a39d':'';if(s<=0)answer($('inp').value,true)},200)}
function stopT(){clearInterval(tmr);tmr=null;if(tAnim){tAnim.cancel();tAnim=null}}
$('inp').addEventListener('input',()=>{$('nq').style.display='none';$('dym').style.display='none'});
$('f').addEventListener('submit',e=>{e.preventDefault();ac();answer($('inp').value,false)});
function invalid(w){thud();shake($('ir'));$('nq').style.display='block';const s=suggest(w,R[S.i]),d=$('dym');if(s){d.dataset.v=s.label;d.textContent='did you mean '+s.label.toLowerCase()+'?';d.style.display='block'}else d.style.display='none';$('inp').select()}
$('dym').onclick=()=>{const v=$('dym').dataset.v;$('dym').style.display='none';answer(v,false)};
// a word that isn't on the list just shakes; you can try again until the timer is up
function answer(raw,timeout){
 if(busy||S.i>=ROUNDS)return;
 const w=norm(raw),r=R[S.i],hit=r.map.get(w),ok=!!hit;
 if(!ok&&!timeout){if(w)invalid(w);return}
 busy=true;stopT();
 const t=ok?TP[hit.ti]:AV;
 S.log.push({w:ok?hit.label:'',k:t.k,m:t.m,q:r.q,best:r.best});S.i++;S.total+=t.m;sv();
 show('ok');$('okS').className='stamp t-'+t.k;$('okS').textContent=t.n;$('okA').textContent=ok?'\u201c'+hit.label.toLowerCase()+'\u201d':'time\'s up';$('okP').textContent='+0';setTimeout(()=>countUp($('okP'),t.m,'+',600),350);$('okF').textContent=t.sub;$('nx').classList.remove('on');
 let dur=1;
 if(ok){click();const pf=t.k==='pk',d0=Math.max(3.2,4.6-.3*Math.max(0,S.i-2));dur=pf?d0*1.15:d0;setTimeout(()=>{whoosh();if(pf){sparkle();perfectFx()}swayFx(dur,pf?1.7:1);climb(dur)},pf?120:180)}else{thud()}
 setTimeout(()=>{$('nx').textContent=S.i>=ROUNDS?'see results':'continue';$('nx').classList.add('on');$('nx').focus()},(ok?dur+.4:1.1)*1000)}
$('nx').onclick=()=>{$('nx').classList.remove('on');if(S.i>=ROUNDS)done();else{show('game');round()}};
function done(){if(!S.best||S.total>S.best.total)S.best={total:S.total,log:S.log};sv();
 $('dsc').textContent=0;setTimeout(()=>countUp($('dsc'),S.total,'',900),350);$('dmax').textContent='/ '+MAXM;
 $('dtag').textContent=S.total>=510?'you reached the summit.':S.total>=400?'a strong ascent.':S.total>=280?'the climb held, mostly.':S.total>=120?'slow and steady.':'the mountain won today.';
 $('rows').innerHTML=S.log.map((l,i)=>{const t=TPK[l.k]||AV;return'<div class="row" style="--i:'+i+'"><div><b>'+(l.w?l.w.toLowerCase():'no answer')+'</b> <small>('+norm(l.w).length+')</small><span class="bs">best: '+l.best+'</span></div><div class="rt"><span class="stamp t-'+t.k+'">'+t.n+'</span><em>'+l.m+'</em></div></div>'}).join('');
 $('cp').textContent='';show('done')}
$('shr').onclick=()=>{const t='Peakly day 1 \ud83c\udfd4\ufe0f\n'+fmt(S.total)+' / '+MAXM+'\n'+S.log.map(l=>(TPK[l.k]||AV).e).join('');
 try{if(navigator.share){navigator.share({text:t}).catch(()=>{});return}}catch(e){}
 try{navigator.clipboard.writeText(t).then(()=>{$('cp').textContent='copied to clipboard'},()=>{$('cp').textContent=t})}catch(e){$('cp').textContent=t}};
$('rpl').onclick=()=>play(true);
// archive + score tiers
function archive(){const b=S.best?S.best.total:S.i>=ROUNDS?S.total:null;
 $('al').innerHTML='<div class="row" style="--i:0"><div><b>day 1</b><span class="bs">'+(b!=null?'best '+b+' / '+MAXM:S.i?'in progress':'not played yet')+'</span></div><button class="btn sm" id="rp">'+(S.i>=ROUNDS?'replay':S.i?'resume':'play')+'</button></div>';
 $('rp').onclick=()=>play(S.i>=ROUNDS);show('arch')}
$('tl').innerHTML=TP.map((t,i)=>'<div class="row" style="--i:'+i+'"><div><span class="stamp t-'+t.k+'">'+t.n+'</span><span class="bs" style="margin-top:6px">'+t.sub+'</span></div><em style="font-style:normal;font-size:24px">'+t.m+'</em></div>').join('');
$('pd').onclick=()=>play(false);$('pa').onclick=archive;
// menu
$('mb').onclick=()=>$('mb').classList.toggle('open',$('mm').classList.toggle('on'));
$('m-home').onclick=()=>show('home');$('m-tiers').onclick=()=>show('tiers');
const snd=()=>{$('m-snd').textContent='sound: '+(on?'on':'off')};snd();
$('m-snd').onclick=()=>{on=!on;snd();try{localStorage.setItem('peakly:snd',on?'1':'0')}catch(e){};if(on)tone(880,.15,.08);$('mm').classList.remove('on');$('mb').classList.remove('open')};
$('ttl').innerHTML=[...'Peakly'].map((c,i)=>'<span style="--i:'+i+'">'+c+'</span>').join('');
show('home');
</script>
</body>
</html>
